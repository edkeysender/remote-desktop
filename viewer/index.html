<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>remote-desktop viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
           background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
  input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
          padding: 6px 8px; border-radius: 6px; font-size: 14px; }
  input#id { width: 130px; letter-spacing: 2px; }
  input#pw { width: 120px; }
  input#url { width: 210px; }
  button { background: #238636; border: 0; color: #fff; padding: 7px 14px;
           border-radius: 6px; font-size: 14px; cursor: pointer; }
  button.stop { background: #da3633; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; font-size: 13px; color: #8b949e; }
  #stage { display: grid; place-items: center; height: calc(100vh - 51px); background: #010409; }
  canvas { max-width: 100%; max-height: 100%; cursor: none; box-shadow: 0 0 0 1px #30363d;
           image-rendering: auto; display: none; }
  #hint { color: #6e7681; font-size: 14px; text-align: center; line-height: 1.6; }
  kbd { background:#21262d;border:1px solid #30363d;border-radius:4px;padding:1px 5px;font-size:12px; }
</style>
</head>
<body>
<header>
  <input id="url" value="ws://localhost:8080" title="Signaling server URL" />
  <input id="id" placeholder="ID (9 digits)" inputmode="numeric" />
  <input id="pw" type="password" placeholder="password" />
  <button id="connect">Connect</button>
  <span id="status">idle</span>
</header>

<div id="stage">
  <div id="hint">
    Enter the host's <b>ID</b> and <b>password</b>, then <b>Connect</b>.<br>
    Once connected, this area shows the remote screen and forwards your mouse &amp; keyboard.<br>
    <span style="font-size:12px">Grab keyboard focus by clicking the screen. Press <kbd>Esc</kbd>·<kbd>Esc</kbd> quickly to release.</span>
  </div>
  <canvas id="screen"></canvas>
</div>

<script>
const $ = (id) => document.getElementById(id);
const urlEl = $('url'), idEl = $('id'), pwEl = $('pw'), connectBtn = $('connect');
const statusEl = $('status'), canvas = $('screen'), hint = $('hint');
const ctx = canvas.getContext('2d', { alpha: false });

let ws = null, connected = false, srcW = 0, srcH = 0;
let img = new Image();          // reused for decoding JPEG blobs
let lastMoveSent = 0;

function setStatus(s, color) { statusEl.textContent = s; statusEl.style.color = color || '#8b949e'; }

connectBtn.onclick = () => connected ? disconnect() : connect();

function connect() {
  const url = urlEl.value.trim();
  ws = new WebSocket(url);
  ws.binaryType = 'blob';
  setStatus('connecting…', '#d29922');

  ws.onopen = () => {
    ws.send(JSON.stringify({ t: 'connect', id: idEl.value.trim(), password: pwEl.value }));
    setStatus('authenticating…', '#d29922');
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') { drawFrame(ev.data); return; }
    const msg = JSON.parse(ev.data);
    if (msg.t === 'connected') {
      connected = true;
      connectBtn.textContent = 'Disconnect'; connectBtn.className = 'stop';
      hint.style.display = 'none'; canvas.style.display = 'block';
      setStatus('● connected', '#3fb950');
    } else if (msg.t === 'screen') {
      srcW = msg.w; srcH = msg.h;
      canvas.width = srcW; canvas.height = srcH;
    } else if (msg.t === 'rejected') {
      setStatus('rejected: ' + msg.reason, '#f85149'); cleanup();
    } else if (msg.t === 'bye') {
      setStatus('closed: ' + (msg.reason || ''), '#f85149'); cleanup();
    }
  };

  ws.onerror = () => setStatus('connection error', '#f85149');
  ws.onclose = () => { if (connected) setStatus('disconnected', '#8b949e'); cleanup(); };
}

function disconnect() { try { ws && ws.send(JSON.stringify({ t: 'bye' })); } catch {} ws && ws.close(); cleanup(); }

function cleanup() {
  connected = false;
  connectBtn.textContent = 'Connect'; connectBtn.className = '';
  canvas.style.display = 'none'; hint.style.display = 'block';
}

function drawFrame(blob) {
  const url = URL.createObjectURL(blob);
  const frame = new Image();
  frame.onload = () => { ctx.drawImage(frame, 0, 0, canvas.width, canvas.height); URL.revokeObjectURL(url); };
  frame.src = url;
}

// ---- input capture: normalize to 0..1 of the displayed image ----
function norm(e) {
  const r = canvas.getBoundingClientRect();
  // canvas is letterboxed (object-fit via max-*); compute the drawn rect.
  const scale = Math.min(r.width / canvas.width, r.height / canvas.height);
  const drawW = canvas.width * scale, drawH = canvas.height * scale;
  const offX = r.left + (r.width - drawW) / 2, offY = r.top + (r.height - drawH) / 2;
  const x = (e.clientX - offX) / drawW, y = (e.clientY - offY) / drawH;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}
function send(o) { if (connected && ws.readyState === 1) ws.send(JSON.stringify(o)); }

canvas.addEventListener('mousemove', (e) => {
  const now = performance.now();
  if (now - lastMoveSent < 12) return;   // ~80 Hz cap
  lastMoveSent = now;
  const p = norm(e); send({ t: 'm', x: p.x, y: p.y });
});
canvas.addEventListener('mousedown', (e) => { e.preventDefault(); const p = norm(e); send({ t: 'b', x: p.x, y: p.y, btn: e.button, down: true }); });
canvas.addEventListener('mouseup',   (e) => { e.preventDefault(); const p = norm(e); send({ t: 'b', x: p.x, y: p.y, btn: e.button, down: false }); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => { e.preventDefault(); send({ t: 'w', dy: e.deltaY > 0 ? -120 : 120 }); }, { passive: false });

// keyboard only while the canvas has focus
canvas.tabIndex = 0;
canvas.addEventListener('mousedown', () => canvas.focus());
let lastEsc = 0;
canvas.addEventListener('keydown', (e) => {
  e.preventDefault();
  if (e.code === 'Escape') { const n = performance.now(); if (n - lastEsc < 400) { canvas.blur(); return; } lastEsc = n; }
  send({ t: 'k', code: e.code, down: true });
});
canvas.addEventListener('keyup', (e) => { e.preventDefault(); send({ t: 'k', code: e.code, down: false }); });
</script>
</body>
</html>
