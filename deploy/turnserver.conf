# coturn config for Remotler's TURN relay (WebRTC fallback when direct P2P fails across
# the internet / strict NATs). Install: sudo apt install coturn
# Enable the service: set TURNSERVER_ENABLED=1 in /etc/default/coturn, put this at
# /etc/turnserver.conf, then: sudo systemctl enable --now coturn
#
# Credentials use the TURN REST API (use-auth-secret): the signaling server holds the
# same secret (TURN_SECRET in remotler-signal.service) and mints short-lived per-session
# credentials, so no long-term TURN password is stored in the org database or handed to
# a browser. With TURN_URL set on the signaling server, every org gets this relay as
# the default fallback automatically — no per-org dashboard setup needed. An org can
# still override with its own relay (static credentials → swap use-auth-secret for
# `lt-cred-mech` + `user=name:pass` on that relay) or opt out of anything external by
# saving an empty STUN list in Configurations → Network / relay.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=change-me-turn-secret
realm=remotler.com

# Reuse the Let's Encrypt cert (share with Caddy, or issue one via certbot).
cert=/etc/letsencrypt/live/remotler.com/fullchain.pem
pkey=/etc/letsencrypt/live/remotler.com/privkey.pem

# Relay port range — open these UDP ports in the firewall too.
min-port=49152
max-port=65535

# --- Peer restrictions (important) ---------------------------------------------------
# Without these, anyone holding the TURN credential can ask the relay to forward packets
# to ANY address the droplet can reach — including 169.254.169.254 (cloud instance
# metadata) and the provider's private network. That turns the relay into an SSRF pivot
# that bypasses the host firewall entirely. Legitimate WebRTC peers are public addresses,
# so denying private/special ranges costs nothing.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Cap what a single credential can consume, so a leaked one can't be farmed for bandwidth.
user-quota=12
total-quota=1200

no-cli
no-tlsv1
no-tlsv1_1
