# coturn config for Hangar's TURN relay (WebRTC fallback when direct P2P fails across
# the internet / strict NATs). Install: sudo apt install coturn
# Enable the service: set TURNSERVER_ENABLED=1 in /etc/default/coturn, put this at
# /etc/turnserver.conf, then: sudo systemctl enable --now coturn
#
# Then in the org dashboard → Configurations → Network / relay:
#   STUN servers: stun:hangar.example.com:3478
#   TURN URL:     turn:hangar.example.com:3478   (or turns: on 5349 for TLS)
#   TURN user:    hangar      TURN password: change-me-turn-secret

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
user=hangar:change-me-turn-secret
realm=hangar.example.com

# Reuse the Let's Encrypt cert (share with Caddy, or issue one via certbot).
cert=/etc/letsencrypt/live/hangar.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/hangar.example.com/privkey.pem

# Relay port range — open these UDP ports in the firewall too.
min-port=49152
max-port=65535

no-cli
no-tlsv1
no-tlsv1_1
