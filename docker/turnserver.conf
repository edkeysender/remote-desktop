# coturn config — copy to turnserver.local.conf and edit before use.
# Used from Phase 2 onward as the WebRTC relay fallback.

listening-port=3478
tls-listening-port=5349

# Public IP of the VPS. If behind a cloud NAT, set external-ip=PUBLIC/PRIVATE.
external-ip=CHANGE_ME_PUBLIC_IP

realm=rd.example.com
server-name=rd.example.com

# Time-limited credentials: the signaling server HMACs a timestamp with this
# secret to mint short-lived usernames/passwords. The secret never leaves the VPS.
use-auth-secret
static-auth-secret=CHANGE_ME_RUN_openssl_rand_hex_32

# Keep the relay port range tight; widen only if you actually need concurrency.
min-port=49160
max-port=49200

# Don't let the relay be abused as an open proxy into private networks.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-cli
fingerprint
log-file=stdout
verbose
